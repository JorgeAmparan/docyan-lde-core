[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docyan-lde-core"
version = "0.0.0"
description = "DOCYAN LDE — Live Document Environment by XCID. Backend (FastAPI)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "XCID SA de CV" }]

# Dependencias DIRECTAS (top-level que el paquete `app` importa).
# El freeze transitivo completo vive en requirements.txt / requirements.docker.txt
# mientras se completa la migración (ver CLAUDE.md §3). Los pines de
# graphrag-sdk / litellm / apscheduler se resuelven en B1 con el resolver real
# (graphrag-sdk 1.1.1 impone restricciones sobre litellm/openai/SDKs Google).
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "PyJWT",
    "bcrypt",
    "python-multipart",
    "email-validator",
    "python-dotenv",
    "supabase",
    "SQLAlchemy",
    "redis",
    "stripe",
    # --- Ingesta multi-formato (DKG, B1) ---
    "docling",
    "llama-index",
    "langextract",
    "graphrag-sdk==1.1.1",   # pin B1 (resolver real: arrastra falkordb 1.6.1, gliner, hnswlib, onnxruntime)
    "litellm==1.86.2",       # pin B1 = versión del smoke test GEMINI (prefijo gemini/ obligatorio)
    "tiktoken",       # cotizador pre-ingesta (B3)
    "tenacity",       # mitigación rate limiting Gemini (B1/B3)
    # --- Scheduler (decisión #3) ---
    "apscheduler",
    # --- Tokens QR (B4) — render SVG sin PIL (pure-python) ---
    "segno",
    # --- Legacy DII/intent (google-genai) — se retira en B1 junto al DII ---
    "google-genai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "psycopg[binary]",   # tests de migración sobre PostgreSQL+pgvector
    "ruff",
    "black",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv", "frontend", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (longitud de línea) lo gestiona black; F401 en __init__ se permite.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# main.py importa los módulos core DESPUÉS de load_dotenv() a propósito:
# app.core.intent/ri instancian genai.Client(api_key=GOOGLE_API_KEY) en import-time,
# por lo que el .env debe cargarse antes de importarlos.
"app/main.py" = ["E402"]
# __init__ re-exporta símbolos.
"__init__.py" = ["F401"]

[tool.black]
target-version = ["py311"]
line-length = 100
extend-exclude = "venv|frontend"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
# B3.5 item 1 — mypy en el toolchain y en CI (el contrato B3 pedía ruff + mypy;
# hasta B3 solo aplicaba ruff). Estrategia por capas:
#   - Global LENIENTE: deps de terceros sin stubs no rompen (ignore_missing_imports),
#     y `follow_imports = silent` hace que SOLO los archivos pasados en CLI reporten
#     errores (los módulos legacy importados transitivamente no ensucian el run).
#   - Camino crítico MVP de pura lógica (app.ingesta.*, app.schemas_documentales.*,
#     supabase_client): STRICT real (ver overrides abajo). CI corre mypy sobre estas
#     rutas + la capa de grafo (.github/workflows/ci.yml, job `mypy`).
#   - Capa de grafo/cola (app.graph.*, app.jobs.*): NON-STRICT justificado — envuelve
#     graphrag-sdk/falkordb/redis, que NO traen stubs y ni siquiera están instalados
#     en el entorno de type-check (graphrag-sdk arrastra torch, fuera de la imagen
#     de CI). Forzar strict ahí pelea contra tipos de terceros ausentes (Any-returns
#     de clientes sin tipar, base de clase dinámica del SDK), no contra deuda propia.
#     Decisión B3.5 item 1: "modo strict solo donde es realista" (contrato). Se
#     type-checkea con la config global (consistencia básica), sin disallow_untyped_defs.
#   - Legacy DII-era (dii/intent/ri/edb/mr): ignore_errors, fuera de alcance MVP.
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
no_strict_optional = true
exclude = "(venv|frontend|migrations)"

# ── Camino crítico MVP de pura lógica: STRICT ───────────────────────────────
# Tipado obligatorio (CLAUDE.md §8: "Type hints obligatorios en funciones
# públicas"). Módulos nuevos (B2/B3) sin dependencia de tipos de terceros ausentes:
# el cotizador (gate financiero), los schemas documentales y el helper de Supabase.
[[tool.mypy.overrides]]
module = [
    "app.ingesta.*",
    "app.schemas_documentales.*",
    "app.core.supabase_client",
    # B7 — gobernanza crítica: GRG extendido + FAT extendido (hash chain SHA-256).
    # Pura lógica sin dependencia de tipos de terceros ausentes → strict real.
    "app.governance.*",
    "app.audit.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

# ── Legacy DII-era: fuera de alcance MVP (CLAUDE.md §4) ──────────────────────
# El DII está deprecado (se elimina tras B5) y su cohorte (intent/ri/edb/mr)
# arrastra deuda de tipos del repo previo. No se tipa en este sprint.
[[tool.mypy.overrides]]
module = [
    "app.core.dii",      # legacy, fuera de alcance MVP (deprecated, elim. tras B5)
    "app.core.intent",   # legacy, fuera de alcance MVP
    "app.core.ri",       # legacy, fuera de alcance MVP
    "app.core.edb",      # legacy, fuera de alcance MVP
    "app.core.mr",       # legacy traducción, fuera de alcance del strict de ingesta
]
ignore_errors = true
