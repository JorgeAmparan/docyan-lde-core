name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── GATE de migraciones: el deploy NO puede declararse verde con la DB de prod
  # desfasada. Compara las migraciones en disco contra el ledger `schema_migrations`
  # de Supabase prod (scripts/apply_migrations.py --check) y FALLA si hay pendientes,
  # de modo que deploy-backend y deploy-frontend NO corren.
  # Razón: el encendido de B13 se reportó verde con la migración 018 (budget RPC)
  # sin aplicar → /confirm daba 500. Esto lo hace imposible de repetir.
  check-migrations:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar psycopg
        run: pip install "psycopg[binary]"
      - name: Verificar que no haya migraciones pendientes en prod
        run: python scripts/apply_migrations.py --check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy-backend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: check-migrations  # no desplegar si la DB de prod está desfasada

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend (docyan-lde-api) to Fly.io
        # B2.2: el config del backend es fly.api.toml (NO el default fly.toml, que
        # se eliminó). Cada app de la topología tiene su propio fly.<app>.toml en
        # la raíz (fly.api / fly.graph) o en su subdir (worker/ redis/ embedder/),
        # para que ningún deploy desde la raíz herede un config ajeno.
        run: flyctl deploy --remote-only --config fly.api.toml --app docyan-lde-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: check-migrations  # no desplegar si la DB de prod está desfasada
    steps:
      - name: Trigger Vercel deploy
        run: |
          echo "Frontend deploys automatically via Vercel GitHub integration."
          echo "No manual action required."
