# docyan-lde-embedder — BGE-M3 self-hosted (B1 §4).
# Proceso Fly INDEPENDIENTE. Sin acceso público: solo *.flycast / .internal.
# Sin volumen persistente: el modelo va en la imagen.
app = "docyan-lde-embedder"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  BGE_MODEL_NAME = "BAAI/bge-m3"
  HF_HOME = "/app/.hf_cache"
  # El modelo va baked en la imagen → modo offline: sin esto, huggingface_hub
  # intenta contactar huggingface.co para verificar revisión en cada carga y se
  # cuelga si el egress es lento (causaba timeouts >300s en la carga). B1 §13.
  HF_HUB_OFFLINE = "1"
  TRANSFORMERS_OFFLINE = "1"

# Servicio interno: escucha en 8000 sobre la red privada de Fly (.internal /
# .flycast). NO se expone http_service público — el backend lo alcanza por DNS
# interno (EMBEDDER_URL=http://docyan-lde-embedder.internal:8000).
[[services]]
  internal_port = 8000
  protocol = "tcp"
  # Siempre encendido: el backend lo alcanza por DNS `.internal` directo, que NO
  # dispara auto-start (solo `.flycast`/fly-proxy lo haría). Mantener 1 máquina
  # viva evita "connection refused" y el cold-start del modelo en cada consulta.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 8000

  # Readiness REAL (ED-0d, deuda del checklist): el check ejercita `/health`, que
  # sólo responde 200 cuando el modelo BGE-M3 cargó + hizo un embed de warmup ("ok").
  # El `tcp_check` anterior pasaba apenas uvicorn bindeaba (ANTES de cargar el modelo)
  # → la máquina se marcaba healthy mientras /embed 503-eaba en el cold-start (flood
  # léxico transitorio observado 2026-07-22). `grace_period` amplio cubre la carga del
  # modelo sin disparar reinicio; sólo tras la gracia un /health que siga 503 se
  # considera no-sano.
  # DEMO-CIERRE (jul 2026): el cold-start REAL medido fue ~6 min (03:08→03:14), NO ~150s
  # — reinicio espontáneo de la máquina tumbó TODO el demo 6 min y el deploy de #54 dio
  # "failure" falso (health no pasó en 300s pese a que la máquina sí levantó). 600s da
  # holgura al cold-start real → sin falsos-failure de deploy ni riesgo de restart-loop.
  # (El cero-downtime real es min_machines_running=2 — decisión de costo de Jorge.)
  [[services.http_checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "600s"
    method = "get"
    path = "/health"

# BGE-M3 necesita RAM para el modelo en memoria. El contrato sugería 4 GB, pero
# en verificación 4 GB resultó insuficiente: el modelo fp32 (~2.3 GB) + overhead
# de torch satura ~3.9 GB y la carga thrashea (>240 s). Subido a 8 GB (B1 §13,
# verdad operacional). Optimización futura (B2): fp16/int8 para bajar a 4 GB.
[[vm]]
  size = "shared-cpu-4x"
  memory = "8gb"
