# docyan-lde-ingest — worker de ingesta (B2 §4.1).
# 4º proceso de la topología DOCYAN. Stack pesado (Docling + GraphRAG-SDK +
# LiteLLM + PyTorch CPU) aislado del backend de consultas. Stateless (sin volumen):
# el documento llega por referencia (document store) y el resultado va al grafo.
#
# Deploy DESDE LA RAÍZ del repo (el Dockerfile hace COPY app/ y COPY worker/, que
# requieren build context = raíz). Comando blindado (B2.2 — ver docs/deploy_topologia_fly.md):
#   flyctl deploy --remote-only --config worker/fly.toml \
#     --app docyan-lde-ingest --dockerfile worker/Dockerfile
# Por qué --app y --dockerfile EXPLÍCITOS: el bug de B2.2 fue que un deploy real
# (no --build-only) desde la raíz, con un fly.toml DEFAULT en la raíz, terminaba
# releaseando la imagen/app del backend. Se eliminó el default root fly.toml
# (ahora fly.api.toml), y se pasan --app (target inequívoco) y --dockerfile
# (ruta relativa a cwd=raíz, inequívoca) para no depender de cómo flyctl resuelva
# [build].dockerfile entre versiones. [build].dockerfile queda como fallback.
app = "docyan-lde-ingest"
primary_region = "dfw"

[build]
  # Valor verificado en --build-only (B2.2): flyctl lo resuelve relativo al dir
  # del --config (worker/) → worker/Dockerfile. El comando de deploy además pasa
  # --dockerfile worker/Dockerfile (relativo a cwd=raíz) como override inequívoco.
  dockerfile = "Dockerfile"

[env]
  # Endpoints internos (los SECRETS reales — API keys — se fijan con flyctl secrets).
  FALKOR_HOST = "docyan-lde-graph.internal"
  FALKOR_PORT = "6379"
  EMBEDDER_URL = "http://docyan-lde-embedder.internal:8000"
  HF_HUB_OFFLINE = "1"
  TRANSFORMERS_OFFLINE = "1"
  # Modelos Docling precargados en build (docling-tools models download); el
  # pipeline los usa como artifacts_path para convertir offline (B2.2).
  DOCLING_ARTIFACTS_PATH = "/root/.cache/docling/models"

# Servicio HTTP PRIVADO (flycast / .internal). SIN handlers públicos: el worker
# recibe jobs por la cola Redis y sirve /health a la red privada de Fly.
[[services]]
  internal_port = 8000
  protocol = "tcp"
  # Jobs largos: la máquina puede dormirse entre ráfagas y despertar con la cola.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 8000

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"

# Perfil de recursos (§4.1): la ingesta carga Docling+TableFormer+torch CPU y es
# intensiva en CPU/RAM. Recomendación inicial shared-cpu-4x / 4 GB; ajustar según
# el peso real de la imagen y el consumo observado (reporte §11).
[[vm]]
  size = "shared-cpu-4x"
  memory = "4gb"
