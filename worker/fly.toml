# docyan-lde-ingest — worker de ingesta (B2 §4.1).
# 4º proceso de la topología DOCYAN. Stack pesado (Docling + GraphRAG-SDK +
# LiteLLM + PyTorch CPU) aislado del backend de consultas. Stateless (sin volumen):
# el documento llega por referencia (document store) y el resultado va al grafo.
#
# Deploy DESDE LA RAÍZ del repo (el Dockerfile hace COPY app/ y COPY worker/, que
# requieren build context = raíz). Comando blindado (B2.2 — ver docs/deploy_topologia_fly.md):
#   flyctl deploy --remote-only --config worker/fly.toml \
#     --app docyan-lde-ingest --dockerfile worker/Dockerfile
# Por qué --app y --dockerfile EXPLÍCITOS: el bug de B2.2 fue que un deploy real
# (no --build-only) desde la raíz, con un fly.toml DEFAULT en la raíz, terminaba
# releaseando la imagen/app del backend. Se eliminó el default root fly.toml
# (ahora fly.api.toml), y se pasan --app (target inequívoco) y --dockerfile
# (ruta relativa a cwd=raíz, inequívoca) para no depender de cómo flyctl resuelva
# [build].dockerfile entre versiones. [build].dockerfile queda como fallback.
app = "docyan-lde-ingest"
primary_region = "dfw"

[build]
  # Valor verificado en --build-only (B2.2): flyctl lo resuelve relativo al dir
  # del --config (worker/) → worker/Dockerfile. El comando de deploy además pasa
  # --dockerfile worker/Dockerfile (relativo a cwd=raíz) como override inequívoco.
  dockerfile = "Dockerfile"

[env]
  # Endpoints internos (los SECRETS reales — API keys — se fijan con flyctl secrets).
  FALKOR_HOST = "docyan-lde-graph.internal"
  FALKOR_PORT = "6379"
  # flycast (NO .internal): el embedder bind 0.0.0.0 (IPv4) por diseño y se
  # alcanza por fly-proxy (.flycast), que puentea IPv4↔IPv6. Con .internal (6PN
  # IPv6 directo) la conexión es rechazada (B2.2).
  EMBEDDER_URL = "http://docyan-lde-embedder.flycast:8000"
  HF_HUB_OFFLINE = "1"
  TRANSFORMERS_OFFLINE = "1"
  # Modelos Docling precargados en build (docling-tools models download); el
  # pipeline los usa como artifacts_path para convertir offline (B2.2).
  DOCLING_ARTIFACTS_PATH = "/root/.cache/docling/models"
  # Resiliencia de extracción (B2.2): el modelo PRIMARIO sigue siendo Gemini 2.5
  # Flash (default del código, CLAUDE.md/Adenda §3). Si falla (presupuesto/quota/
  # rate-limit/API error) el worker reintenta el documento con este FALLBACK.
  # Requiere ANTHROPIC_API_KEY como secret en docyan-lde-ingest.
  INGEST_EXTRACTION_FALLBACK_MODELS = "anthropic/claude-sonnet-4-6"
  # NOTA OPERATIVA: mientras Gemini no tenga presupuesto, se invierte vía
  # `flyctl secrets set INGEST_EXTRACTION_MODEL=anthropic/claude-sonnet-4-6`
  # (primario temporal = Sonnet). Al volver el saldo de Gemini: `flyctl secrets
  # unset INGEST_EXTRACTION_MODEL` → primario vuelve a Gemini, Sonnet queda de fallback.

# Servicio HTTP PRIVADO (flycast / .internal). SIN handlers públicos: el worker
# recibe jobs por la cola Redis y sirve /health a la red privada de Fly.
[[services]]
  internal_port = 8000
  protocol = "tcp"
  # CRÍTICO (B2.2): el worker es un CONSUMIDOR DE COLA, no un servicio HTTP. El
  # autosuspend de Fly se dispara por inactividad de TRÁFICO HTTP, NO por la cola
  # Redis. Con "suspend" + min=0, Fly suspendía la máquina A MITAD de un job (el
  # job se quedaba en `processing` para siempre — verificado en B2.2). Un worker
  # de cola debe estar SIEMPRE vivo: auto_stop off + min 1.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 8000

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"

# Perfil de recursos (§4.1): la ingesta carga Docling+TableFormer+torch CPU y es
# intensiva en CPU/RAM. ED-0e/ED-0f (jul 2026): el OCR redundante (resuelto por el
# gate) NO era el único driver — Docling acumula memoria por página (layout +
# TableFormer + generate_picture_images, 85 PNGs) y NO la libera: LS-400 (88pp)
# escaló monótono 1→7.9 GB y OOM en 8 GB. RAM solo POSPONE (150pp ≈ 14 GB).
# TEMPORAL (ED-0f Paso 1): 16 GB SOLO para capturar la referencia dorada de LS-400.
# Paso 4 revierte a 4 GB una vez que el batching por páginas acota el pico <4 GB.
# NOTA DE COSTO: worker consumidor de cola, auto_stop OFF + min 1 (B2.2) → SIEMPRE
# vivo → estos GB se pagan 24/7. Por eso 16 GB es TEMPORAL, no el estado final.
[[vm]]
  size = "shared-cpu-8x"
  memory = "16gb"
