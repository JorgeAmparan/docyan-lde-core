<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="design_doc_mode" content="canvas">
<title>DOCYAN — Navegación del producto · 3 direcciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet">
<link href="colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-sans);color:var(--fg);background:var(--amate-100);}
  .lic{display:inline-flex;align-items:center;justify-content:center;}
  .lic svg{width:100%;height:100%;}
  /* ---- canvas frames ---- */
  .frame-label{font-family:var(--font-mono);font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink-900);margin-bottom:9px;cursor:grab;}
  .frame-label small{display:block;font-weight:400;color:var(--fg-muted);font-size:11.5px;margin-top:2px;letter-spacing:0;}
  .frame-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px -16px rgba(33,28,22,.28);overflow:hidden;}
  .frame-cap{font-size:12px;color:var(--fg-muted);line-height:1.5;margin-top:10px;max-width:1080px;}
  .frame-cap b{color:var(--fg);font-weight:600;}
  /* window chrome */
  .win{height:704px;display:flex;flex-direction:column;background:var(--bg);}
  .win .dots{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface);}
  .win .dots i{width:10px;height:10px;border-radius:50%;background:#e0d6c8;}
  .win .dots i:nth-child(1){background:#e6685a;}.win .dots i:nth-child(2){background:#e8b04b;}.win .dots i:nth-child(3){background:#4fae6f;}
  .win .stage{flex:1;min-height:0;display:flex;}
  /* ---------- nav: sidebar ---------- */
  .rail{width:208px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 6px 16px;}
  .brand .w{font-weight:700;letter-spacing:.04em;font-size:15px;}
  .brand .lde{font-family:var(--font-mono);font-size:9px;color:var(--accent-fg);border:1px solid var(--cinnabar-200);border-radius:4px;padding:1px 4px;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:13.5px;color:var(--fg-muted);cursor:pointer;font-weight:500;}
  .nav a .lic{width:17px;height:17px;color:var(--fg-subtle);}
  .nav a.on{background:var(--cinnabar-50);color:var(--accent-fg);}
  .nav a.on .lic{color:var(--cinnabar-500);}
  .nav .grp{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-subtle);padding:14px 11px 5px;}
  .rail .org{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px;border-top:1px solid var(--border);}
  .rail .org .av{width:30px;height:30px;border-radius:8px;background:var(--ink-900);color:var(--amate-50);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none;}
  .rail .org .ot{font-size:12.5px;font-weight:600;line-height:1.2;}
  .rail .org .om{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);}
  .plan-chip{margin:10px 4px 0;display:flex;align-items:center;gap:6px;font-size:11px;font-family:var(--font-mono);color:var(--fg-muted);background:var(--amate-50);border:1px solid var(--border);border-radius:8px;padding:7px 9px;}
  .plan-chip .lic{width:13px;height:13px;color:var(--cinnabar-500);}
  .plan-chip a{margin-left:auto;color:var(--accent-fg);font-weight:600;cursor:pointer;}
  /* ---------- nav: icon rail (hybrid) ---------- */
  .irail{width:58px;flex:none;background:var(--ink-950);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;}
  .irail .ib{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--amate-300);cursor:pointer;}
  .irail .ib .lic{width:19px;height:19px;}
  .irail .ib.on{background:rgba(226,84,46,.22);color:#fff;}
  .irail .sp{margin-top:auto;}
  /* ---------- main col ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);}
  .topbar{display:flex;align-items:center;gap:14px;padding:13px 22px;border-bottom:1px solid var(--border);background:var(--surface);}
  .topbar h1{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0;}
  .topbar .ctx-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);display:block;margin-bottom:2px;}
  .search{display:flex;align-items:center;gap:8px;background:var(--amate-50);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-width:0;color:var(--fg-subtle);}
  .search .lic{width:15px;height:15px;flex:none;}
  .search input{border:none;background:transparent;outline:none;font-family:var(--font-sans);font-size:13px;color:var(--fg);width:100%;}
  .av-user{width:32px;height:32px;border-radius:9px;background:var(--cinnabar-500);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;}
  .content{flex:1;overflow:auto;padding:22px 24px;}
  /* ---------- topnav variant ---------- */
  .topnav{display:flex;align-items:center;gap:8px;padding:11px 22px;border-bottom:1px solid var(--border);background:var(--surface);}
  .topnav .nlinks{display:flex;gap:3px;margin-left:18px;}
  .topnav .nlinks a{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--fg-muted);cursor:pointer;}
  .topnav .nlinks a .lic{width:16px;height:16px;color:var(--fg-subtle);}
  .topnav .nlinks a.on{background:var(--cinnabar-50);color:var(--accent-fg);}
  .topnav .nlinks a.on .lic{color:var(--cinnabar-500);}
  .topnav .tn-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
  .subhead{padding:16px 24px 0;}
  .subhead h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .subhead p{margin:5px 0 0;font-size:13px;color:var(--fg-muted);}
  /* ---------- documentos screen ---------- */
  .ph-head h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .ph-head p{margin:5px 0 0;color:var(--fg-muted);font-size:13px;}
  .usage{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin:16px 0;}
  .usage .ut{font-size:13px;font-weight:600;}
  .usage .um{font-size:11.5px;color:var(--fg-muted);margin-top:2px;}
  .usage .track{flex:1;height:7px;border-radius:5px;background:var(--amate-100);overflow:hidden;}
  .usage .track i{display:block;height:100%;background:var(--cinnabar-500);}
  .usage .num{font-family:var(--font-mono);font-size:13px;color:var(--fg-muted);}
  .usage .num b{color:var(--fg);}
  .doc-row{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--surface);}
  .doc-row .di{width:38px;height:38px;border-radius:10px;background:var(--amate-50);display:flex;align-items:center;justify-content:center;color:var(--fg-muted);flex:none;}
  .doc-row .dn{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .badge-vivo{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--success-600);background:var(--success-100);border-radius:20px;padding:2px 8px;}
  .badge-vivo .bd{width:5px;height:5px;border-radius:50%;background:var(--success-600);}
  .doc-row .dm{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);margin-top:4px;display:flex;gap:7px;}
  .doc-row .da{margin-left:auto;display:flex;gap:6px;}
  .doc-row .da button{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .doc-row .da button .lic{width:15px;height:15px;}
  .upcta{display:flex;align-items:center;gap:13px;border:1.5px dashed var(--border-strong);border-radius:12px;padding:15px 16px;cursor:pointer;background:var(--amate-50);}
  .upcta .ui{width:38px;height:38px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--cinnabar-500);}
  .upcta .ut{font-size:14px;font-weight:600;}
  .upcta .um{font-size:11.5px;color:var(--fg-muted);}
  .upcta .ub{margin-left:auto;font-size:12.5px;font-weight:600;color:#fff;background:var(--cinnabar-500);border:none;border-radius:9px;padding:9px 14px;display:flex;align-items:center;gap:7px;cursor:pointer;}
  .hint{font-size:11.5px;color:var(--fg-subtle);margin-top:13px;display:flex;align-items:center;gap:7px;font-family:var(--font-mono);}
  /* ---------- consult ---------- */
  .cwrap{display:flex;gap:18px;height:100%;}
  .cwrap.centered{justify-content:center;}
  .cwrap.centered .cthread{max-width:560px;}
  .cpane{flex:1;min-width:0;display:flex;flex-direction:column;}
  .cpane.left{max-width:300px;flex:none;}
  .codo-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 13px;margin-bottom:14px;}
  .codo-bar .ci{width:30px;height:30px;border-radius:8px;background:var(--cinnabar-50);color:var(--cinnabar-500);display:flex;align-items:center;justify-content:center;flex:none;}
  .codo-bar .cc{font-family:var(--font-mono);font-size:11px;color:var(--accent-fg);}
  .codo-bar .cnm{font-size:13.5px;font-weight:600;}
  .codo-bar .chg{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent-fg);display:flex;align-items:center;gap:5px;cursor:pointer;}
  .codo-bar .chg .lic{width:14px;height:14px;}
  .entity{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .entity h3{margin:0;font-size:14.5px;font-weight:700;}
  .entity .em{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-muted);margin-top:3px;}
  .sugs{display:flex;flex-direction:column;gap:8px;margin-top:13px;}
  .sug{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;color:var(--fg);background:var(--amate-50);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;}
  .sug .lic{width:15px;height:15px;color:var(--cinnabar-500);flex:none;}
  .sug .ar{margin-left:auto;color:var(--fg-subtle);}
  .bubble{align-self:flex-end;background:var(--ink-900);color:var(--amate-50);font-size:13.5px;padding:9px 13px;border-radius:14px 14px 4px 14px;max-width:80%;margin-bottom:12px;}
  .mode{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--success-600);margin-bottom:8px;}
  .mode .pulse{width:7px;height:7px;border-radius:50%;background:var(--success-600);}
  .acard{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);padding:16px;}
  .acard .q{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-subtle);}
  .acard .big{font-weight:700;font-size:36px;letter-spacing:-.02em;line-height:1;margin-top:6px;}
  .acard .big .u{font-size:16px;font-weight:500;color:var(--fg-muted);margin-left:3px;}
  .acard .note{font-size:13.5px;color:var(--fg-muted);line-height:1.5;margin:8px 0 0;}
  .citerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:13px;}
  .cite2{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--accent-fg);background:var(--cinnabar-50);border:1px solid var(--cinnabar-100);padding:5px 10px 5px 8px;border-radius:8px;cursor:pointer;}
  .cite2 .brk{position:relative;width:12px;height:12px;flex:none;}
  .cite2 .brk::before,.cite2 .brk::after{content:"";position:absolute;top:0;bottom:0;width:4px;border:1.5px solid var(--cinnabar-500);}
  .cite2 .brk::before{left:0;border-right:none;border-radius:2px 0 0 2px;}
  .cite2 .brk::after{right:0;border-left:none;border-radius:0 2px 2px 0;}
  .openpdf{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--fg-muted);background:transparent;border:1px dashed var(--border-strong);padding:5px 11px;border-radius:8px;cursor:pointer;}
  .openpdf .lic{width:13px;height:13px;}
  .src{position:relative;margin-top:12px;}
  .src .thread{position:absolute;left:18px;top:-10px;width:2px;height:12px;background:var(--cinnabar-300);}
  .src2{background:var(--amate-50);border:1px solid var(--border);border-radius:10px;padding:11px 13px;}
  .src2 .s-head{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:7px;}
  .src2 .s-head .lic{width:12px;height:12px;}
  .src2 .s-head .pg{margin-left:auto;}
  .src2 .s-span{font-family:var(--font-serif);font-size:13px;line-height:1.55;color:var(--ink-800);}
  .src2 .s-span mark{background:var(--cinnabar-100);color:var(--ink-900);padding:1px 3px;border-radius:3px;}
  .src2 .s-orig{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);margin-top:8px;}
  .src2 .s-orig .lic{width:11px;height:11px;}
  .src2 .s-actions{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .src2 .s-ped{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:9.5px;color:var(--fg-subtle);}
  .src2 .s-ped .lic{width:12px;height:12px;color:var(--success-600);}
  .src2 .s-actions .openpdf{margin-left:auto;}
  .doctabs{display:flex;gap:7px;margin-bottom:14px;}
  .doctab{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);background:var(--amate-50);border:1px solid var(--border);border-radius:9px;padding:7px 11px;cursor:pointer;}
  .doctab.on{border-color:var(--cinnabar-300);background:var(--surface);color:var(--fg);}
  .doctab .lic{width:13px;height:13px;color:var(--cinnabar-500);}
  .qbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--cinnabar-300);border-radius:30px;padding:5px 5px 5px 16px;margin-top:14px;box-shadow:0 0 0 3px var(--cinnabar-50);}
  .qbar input{flex:1;border:none;outline:none;background:transparent;font-size:13.5px;color:var(--fg);}
  .qbar .send{width:36px;height:36px;border-radius:50%;border:none;background:var(--cinnabar-500);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .qbar .send .lic{width:16px;height:16px;}
  /* ---------- mobile ---------- */
  .phone{width:320px;height:660px;border-radius:30px;border:9px solid var(--ink-950);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 18px 50px -20px rgba(33,28,22,.4);}
  .ph-status{display:flex;justify-content:space-between;align-items:center;padding:9px 18px 4px;font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);}
  .ph-top{display:flex;align-items:center;gap:10px;padding:6px 16px 12px;border-bottom:1px solid var(--border);}
  .ph-top .w{font-weight:700;font-size:14px;letter-spacing:.03em;}
  .ph-top .lde{font-family:var(--font-mono);font-size:8px;color:var(--accent-fg);border:1px solid var(--cinnabar-200);border-radius:3px;padding:1px 3px;}
  .ph-top .av{margin-left:auto;width:28px;height:28px;border-radius:8px;background:var(--cinnabar-500);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
  .ph-body{flex:1;overflow:auto;padding:14px;}
  .ph-search{display:flex;align-items:center;gap:8px;background:var(--amate-50);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--fg-subtle);margin-bottom:14px;}
  .ph-search .lic{width:15px;height:15px;}
  .ph-search span{font-size:13px;}
  .tabbar{display:flex;border-top:1px solid var(--border);background:var(--surface);padding:6px 4px 10px;}
  .tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--fg-subtle);cursor:pointer;font-weight:500;}
  .tabbar .tab .lic{width:21px;height:21px;}
  .tabbar .tab.on{color:var(--accent-fg);}
  .tabbar .tab.on .lic{color:var(--cinnabar-500);}
  .legend{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 26px;box-shadow:0 12px 40px -16px rgba(33,28,22,.2);}
  .legend h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;}
  .legend p{margin:10px 0 0;font-size:14px;color:var(--fg-muted);line-height:1.6;max-width:760px;}
  .legend .flow{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .legend .fstep{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--amate-50);border:1px solid var(--border);border-radius:10px;padding:9px 13px;}
  .legend .fstep .lic{width:16px;height:16px;color:var(--cinnabar-500);}
  .legend .farr{color:var(--fg-subtle);}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useEffect, useRef } = React;
function Icon({ name, size = 18, color }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el || !window.lucide) return;
    el.innerHTML = ""; const i = document.createElement("i"); i.setAttribute("data-lucide", name); el.appendChild(i);
    try { window.lucide.createIcons(); } catch (e) {}
  }, [name]);
  return <span className="lic" ref={ref} style={{ width: size, height: size, color }} />;
}
const NAV = [["files","Documentos","documentos"],["scan-line","Consultar","consultar"],["users","Usuarios","usuarios"],["gem","Plan","plan"]];

/* ---- shells ---- */
function Brand(){return <div className="brand"><Icon name="square-dashed" size={22} color="var(--cinnabar-500)"/><span className="w">DOCYAN</span><span className="lde">LDE</span></div>;}
function SearchBar({ph}){return <div className="search" style={{flex:1,maxWidth:360}}><Icon name="search" size={15}/><input placeholder={ph}/></div>;}

function ShellSidebar({active,title,eyebrow,children}){
  return <div className="win"><div className="dots"><i/><i/><i/></div><div className="stage">
    <aside className="rail"><Brand/>
      <div className="plan-chip"><Icon name="gift" size={13}/>Gratuito · 2 de 3<a>Plan</a></div>
      <nav className="nav"><div className="grp">Producto</div>
        {NAV.map(n=><a key={n[2]} className={active===n[2]?"on":""}><Icon name={n[0]} size={17}/>{n[1]}</a>)}
      </nav>
      <div className="org"><div className="av">LE</div><div><div className="ot">Laboratorio Estándar</div><div className="om">ES-MX · EN-US</div></div></div>
    </aside>
    <div className="main"><header className="topbar">
      <div>{eyebrow&&<span className="ctx-eyebrow">{eyebrow}</span>}<h1>{title}</h1></div>
      <SearchBar ph="Busca un documento o pregunta…"/><div className="av-user">JM</div>
    </header><div className="content">{children}</div></div>
  </div></div>;
}
function ShellTopbar({active,children}){
  return <div className="win"><div className="dots"><i/><i/><i/></div><div className="stage"><div className="main">
    <header className="topnav"><Brand/>
      <div className="nlinks">{NAV.map(n=><a key={n[2]} className={active===n[2]?"on":""}><Icon name={n[0]} size={16}/>{n[1]}</a>)}</div>
      <div className="tn-right"><SearchBar ph="Busca o pregunta…"/><div className="plan-chip" style={{margin:0}}><Icon name="gift" size={13}/>2 de 3<a>Plan</a></div><div className="av-user">JM</div></div>
    </header>{children}</div></div></div>;
}
function ShellHybrid({active,title,eyebrow,actions,children}){
  return <div className="win"><div className="dots"><i/><i/><i/></div><div className="stage">
    <aside className="irail">
      <div className="ib" style={{marginBottom:8}}><Icon name="square-dashed" size={20} color="#fff"/></div>
      {NAV.map(n=><div key={n[2]} className={"ib"+(active===n[2]?" on":"")}><Icon name={n[0]} size={19}/></div>)}
      <div className="ib sp"><Icon name="user" size={19}/></div>
    </aside>
    <div className="main"><header className="topbar">
      <div>{eyebrow&&<span className="ctx-eyebrow">{eyebrow}</span>}<h1>{title}</h1></div>
      <SearchBar ph="Busca un documento o pregunta…"/>{actions}<div className="av-user">JM</div>
    </header><div className="content">{children}</div></div>
  </div></div>;
}

/* ---- screens ---- */
function Documentos(){
  return <div className="ph-head">
    <h2>Documentos vivos</h2><p>Tus documentos consultables. En el plan gratuito puedes tener hasta 3.</p>
    <div className="usage"><div style={{flex:'none'}}><div className="ut">Plan gratuito</div><div className="um">Te queda 1 documento · 27 días</div></div>
      <div className="track"><i style={{width:'66%'}}/></div><div className="num"><b>2</b> / 3</div></div>
    {[["Manual operativo CNC.pdf","CODO-MAQ-02 · CNC Haas VF-4","2.4 MB · 48 pág."],["Procedimiento de calibración.pdf","CODO-LAB-04 · Centrífugas & rotores","1.1 MB · 22 pág."]].map((d,i)=>
      <div className="doc-row" key={i}><span className="di"><Icon name="file-text" size={19}/></span>
        <div style={{minWidth:0}}><div className="dn">{d[0]}<span className="badge-vivo"><span className="bd"/>vivo</span></div>
          <div className="dm"><span>{d[1]}</span><span>·</span><span>{d[2]}</span></div></div>
        <div className="da"><button><Icon name="refresh-cw" size={15}/></button><button><Icon name="trash-2" size={15}/></button></div>
      </div>)}
    <div className="upcta"><span className="ui"><Icon name="upload-cloud" size={22}/></span>
      <div><div className="ut">Cargar documento</div><div className="um">Súbelo como está · 1 disponible en tu plan</div></div>
      <button className="ub"><Icon name="plus" size={15}/>Cargar</button></div>
    <div className="hint"><Icon name="search" size={13}/>Escribe arriba para filtrar; elige un documento y entras directo a consultarlo.</div>
  </div>;
}
function AnswerCard(){
  return <><div className="bubble">¿Torque del perno B?</div>
    <div className="mode"><span className="pulse"/>Respuesta instantánea · caché</div>
    <div className="acard"><div className="q">Torque del perno B — cabezal</div>
      <div className="big">85<span className="u">N·m</span></div>
      <p className="note">Aplicado en cruz, en tres etapas progresivas (40 → 65 → 85 N·m).</p>
      <div className="citerow"><button className="cite2"><span className="brk"/>Manual VF-2 · §4.2.1 · pág. 12 ↗</button>
        <button className="openpdf"><Icon name="external-link" size={13}/>Abrir PDF</button></div>
      <div className="src"><span className="thread"/><div className="src2">
        <div className="s-head"><Icon name="file-text" size={12}/><span>Fragmento original</span><span className="pg">pág. 12</span></div>
        <div className="s-span">Head assembly — <mark>bolt B torque: 85 N·m</mark>, applied crosswise in three progressive stages (40 → 65 → 85 N·m).</div>
        <span className="s-orig"><Icon name="globe" size={11}/>Documento original en inglés · tú preguntaste en español</span>
        <div className="s-actions"><span className="s-ped"><Icon name="shield-check" size={12}/>Pedigree a span · SHA-256</span>
          <button className="openpdf"><Icon name="external-link" size={13}/>Abrir PDF</button></div>
      </div></div>
    </div></>;
}
function CodoBar({chg}){return <div className="codo-bar"><span className="ci"><Icon name="disc-3" size={17}/></span>
  <div><div className="cc">CODO-LAB-04</div><div className="cnm">Centrífuga Hettich Rotina 380</div></div>
  {chg&&<button className="chg"><Icon name="chevrons-up-down" size={14}/>Cambiar</button>}</div>;}
function EntityCard(){return <div className="entity"><h3>Centrífuga Hettich Rotina 380</h3><div className="em">QR escaneado · 4 documentos vivos</div>
  <div className="sugs">{[["gauge","¿Torque del perno B?"],["wrench","¿Cómo cambio el filtro?"],["activity","Vibra al arrancar"]].map((s,i)=>
    <button className="sug" key={i}><Icon name={s[0]} size={15}/>{s[1]}<span className="ar">→</span></button>)}</div></div>;}
function QBar(){return <div className="qbar"><input placeholder="Pregunta sobre este equipo…"/><button className="send"><Icon name="arrow-up" size={16}/></button></div>;}

function ConsultTwoPane(){
  return <div className="cwrap"><div className="cpane left"><CodoBar/><EntityCard/></div>
    <div className="cpane"><AnswerCard/><QBar/></div></div>;
}
function ConsultCentered(){
  return <div className="cwrap centered"><div className="cpane cthread"><CodoBar chg/><AnswerCard/><QBar/></div></div>;
}
function ConsultWide(){
  return <div className="cpane"><div className="doctabs">
    <div className="doctab on"><Icon name="file-text" size={13}/>Manual VF-2<span style={{color:'var(--fg-subtle)'}}>EN</span></div>
    <div className="doctab"><Icon name="file-text" size={13}/>Hettich — manual</div>
    <div className="doctab"><Icon name="file-text" size={13}/>MSDS refrigerante</div></div>
    <AnswerCard/><QBar/></div>;
}

/* ---- mobile ---- */
function Phone({screen}){
  return <div className="phone"><div className="ph-status"><span>9:41</span><span>▮▮▮ ⌁</span></div>
    <div className="ph-top"><Icon name="square-dashed" size={20} color="var(--cinnabar-500)"/><span className="w">DOCYAN</span><span className="lde">LDE</span><span className="av">JM</span></div>
    <div className="ph-body">
      {screen==="documentos"?<><div className="ph-search"><Icon name="search" size={15}/><span>Busca o pregunta…</span></div><Documentos/></>:
        <><CodoBar chg/><AnswerCard/></>}
    </div>
    <div className="tabbar">{NAV.map(n=><div key={n[2]} className={"tab"+((screen==="documentos"&&n[2]==="documentos")||(screen==="consultar"&&n[2]==="consultar")?" on":"")}><Icon name={n[0]} size={21}/>{n[1]}</div>)}</div>
  </div>;
}

/* ---- canvas ---- */
function Frame({x,y,w,label,sub,cap,children}){
  return <div style={{position:"absolute",left:x,top:y,width:w}}>
    <div className="frame-label" data-drags-parent="1">{label}{sub&&<small>{sub}</small>}</div>
    <div className="frame-card">{children}</div>{cap&&<div className="frame-cap">{cap}</div>}
  </div>;
}
const DW=1140;
function App(){
  return <div style={{position:"relative",width:4140,height:1860,padding:"0"}}>
    <div style={{position:"absolute",left:40,top:24,width:1140}}><div className="legend">
      <h1>Navegación del producto autenticado — 3 direcciones</h1>
      <p>Un solo shell para Freemium y pagado (admin va aparte). Móvil = tab bar inferior en las tres. La búsqueda es híbrida: filtra documentos y, al elegir uno, entras a consultarlo. Compara la fila superior (Documentos) para la navegación, y la inferior (Consultar) para cómo se siente la consulta en escritorio.</p>
      <div className="flow"><span className="fstep"><Icon name="upload-cloud" size={16}/>Ingiere documentos</span><span className="farr">→</span>
        <span className="fstep"><Icon name="search" size={16}/>Elige qué consultar</span><span className="farr">→</span>
        <span className="fstep"><Icon name="scan-line" size={16}/>Consulta con cita</span></div>
    </div></div>

    <Frame x={40} y={210} w={DW} label="A · Sidebar fija" sub="Documentos" cap={<>Rail izquierdo persistente siempre visible (como el admin). <b>Coherencia máxima</b>: el usuario siempre ve dónde está y qué sigue. Buscador en la barra superior de cada sección.</>}><ShellSidebar active="documentos" eyebrow="Producto" title="Documentos"><Documentos/></ShellSidebar></Frame>
    <Frame x={1240} y={210} w={DW} label="B · Barra superior" sub="Documentos" cap={<>Nav horizontal arriba + buscador global centrado. <b>Más aire</b> y ancho completo para el contenido; familiar tipo web app. El plan y la cuenta viven a la derecha.</>}><ShellTopbar active="documentos"><div className="subhead"><h1>Documentos vivos</h1></div><div className="content" style={{paddingTop:14}}><Documentos/></div></ShellTopbar></Frame>
    <Frame x={2440} y={210} w={DW} label="C · Rail compacto + barra contextual" sub="Documentos" cap={<>Rail de iconos delgado (oscuro) + barra superior contextual por sección. <b>Densidad y foco</b>: mínimo cromo, máximo lienzo — ideal cuando crezca a multi-CoDo.</>}><ShellHybrid active="documentos" eyebrow="Producto" title="Documentos"><Documentos/></ShellHybrid></Frame>

    <Frame x={40} y={1010} w={DW} label="A · Consultar" sub="dos paneles" cap={<>Elegir-qué-consultar <b>plegado dentro</b>: contexto del CoDo a la izquierda, hilo de respuestas a la derecha. El fragmento original se revela inline (patrón del hero).</>}><ShellSidebar active="consultar" eyebrow="Consultando · CODO-LAB-04" title="Centrífuga Hettich"><ConsultTwoPane/></ShellSidebar></Frame>
    <Frame x={1240} y={1010} w={DW} label="B · Consultar" sub="columna centrada" cap={<>Columna central cómoda (no ancho de móvil). Cambias de documento con el selector arriba del hilo. <b>Lectura enfocada</b>, una sola cosa a la vez.</>}><ShellTopbar active="consultar"><div className="content"><ConsultCentered/></div></ShellTopbar></Frame>
    <Frame x={2440} y={1010} w={DW} label="C · Consultar" sub="layout web amplio" cap={<>Pestañas de documento arriba (cambias de fuente sin salir), respuesta ancha. La <b>búsqueda híbrida</b> abre aquí directo al elegir un documento.</>}><ShellHybrid active="consultar" eyebrow="Consultando · CODO-LAB-04" title="Centrífuga Hettich"><ConsultWide/></ShellHybrid></Frame>

    <div style={{position:"absolute",left:3640,top:210,width:360}}><div className="frame-label" data-drags-parent="1">Móvil · Documentos<small>igual en las 3 direcciones</small></div><Phone screen="documentos"/></div>
    <div style={{position:"absolute",left:3640,top:1010,width:360}}><div className="frame-label" data-drags-parent="1">Móvil · Consultar<small>tab bar inferior</small></div><Phone screen="consultar"/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
