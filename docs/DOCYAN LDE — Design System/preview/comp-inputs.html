<!doctype html>
<!-- @dsCard group="Components" name="Inputs & query box" subtitle="Fields, focus state & the operator query box" viewport="700x180" --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet"><link href="_card.css" rel="stylesheet">
<style>
  body{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:6px;width:280px;}
  .lab{font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--fg);}
  .inp{height:40px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);
    padding:0 12px;font-family:var(--font-sans);font-size:14px;color:var(--fg);outline:none;transition:all var(--dur-fast) var(--ease-out);}
  .inp::placeholder{color:var(--fg-subtle);}
  .inp:focus{border-color:var(--cinnabar-500);box-shadow:0 0 0 3px var(--cinnabar-50);}
  .hint{font-family:var(--font-sans);font-size:12px;color:var(--fg-muted);}
  /* prominent query box (collaborator) */
  .query{display:flex;align-items:center;gap:10px;height:56px;border:1.5px solid var(--border-strong);border-radius:var(--radius-xl);
    background:var(--surface);padding:0 8px 0 16px;width:300px;box-shadow:var(--shadow-sm);}
  .query input{flex:1;border:none;outline:none;background:transparent;font-family:var(--font-sans);font-size:15px;color:var(--fg);}
  .query .mic{width:40px;height:40px;border-radius:var(--radius-lg);background:var(--cinnabar-500);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .query svg{width:18px;height:18px;}
  .qlab{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:7px;}
</style></head>
<body>
  <div>
    <div class="qlab">Caja de consulta · colaborador</div>
    <div class="query"><input placeholder="¿Torque del perno B?" /><button class="mic" aria-label="Voz a texto"><i data-lucide="mic"></i></button></div>
  </div>
  <div class="field">
    <span class="lab">Correo</span>
    <input class="inp" placeholder="nombre@laboratorio.mx" />
    <span class="hint">Te enviaremos el acceso a tu organización.</span>
  </div>
  <div class="field">
    <span class="lab">Umbral de confianza del caché</span>
    <input class="inp" value="0.92" style="font-family:var(--font-mono);border-color:var(--cinnabar-500);box-shadow:0 0 0 3px var(--cinnabar-50);" />
    <span class="hint" style="color:var(--accent-fg)">Focus state</span>
  </div>
<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
