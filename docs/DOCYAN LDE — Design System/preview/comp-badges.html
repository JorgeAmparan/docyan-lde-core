<!doctype html>
<!-- @dsCard group="Components" name="Badges & tags" subtitle="Status, criticidad thresholds, plan & regulatory tags" viewport="700x170" --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet"><link href="_card.css" rel="stylesheet">
<style>
  .badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-sans);font-size:12px;font-weight:500;
    padding:3px 9px;border-radius:var(--radius-full);border:1px solid transparent;line-height:1.4;}
  .badge svg{width:12px;height:12px;}
  .dot{width:6px;height:6px;border-radius:50%;}
  .b-ok{background:var(--success-100);color:var(--success-600);}
  .b-warn{background:var(--warning-100);color:var(--warning-600);}
  .b-danger{background:var(--danger-100);color:var(--danger-600);}
  .b-info{background:var(--info-100);color:var(--info-600);}
  .b-neutral{background:var(--amate-100);color:var(--fg-muted);}
  .b-accent{background:var(--cinnabar-50);color:var(--accent-fg);border-color:var(--cinnabar-100);}
  .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .glab{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-subtle);width:120px;flex:none;}
</style></head>
<body>
  <div class="row2"><span class="glab">Estado ingesta</span>
    <span class="badge b-ok"><span class="dot" style="background:currentColor"></span>Terminado</span>
    <span class="badge b-warn"><span class="dot" style="background:currentColor"></span>Procesando</span>
    <span class="badge b-danger"><span class="dot" style="background:currentColor"></span>Fallido</span>
    <span class="badge b-neutral"><span class="dot" style="background:currentColor"></span>Encolado</span>
  </div>
  <div class="row2"><span class="glab">Criticidad</span>
    <span class="badge b-danger">Seguridad ≥0.95</span>
    <span class="badge b-warn">Regulatorio ≥0.90</span>
    <span class="badge b-info">Calidad ≥0.85</span>
    <span class="badge b-neutral">Operacional ≥0.75</span>
  </div>
  <div class="row2" style="margin-bottom:0"><span class="glab">Plan / contexto</span>
    <span class="badge b-accent">Profesional</span>
    <span class="badge b-neutral" style="font-family:var(--font-mono);font-size:11px">CODO-LAB-04</span>
    <span class="badge b-neutral" style="font-family:var(--font-mono);font-size:11px">NOM-018-STPS</span>
    <span class="badge b-ok"><i data-lucide="shield-check"></i>Cadena verificada</span>
  </div>
<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
