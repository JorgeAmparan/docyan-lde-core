<!doctype html>
<!-- @dsCard group="Brand" name="Logo & mark" subtitle="Bracket-frame mark + wordmark, light & dark" viewport="700x215" --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet"><link href="_card.css" rel="stylesheet">
<style>
  .lockup{display:inline-flex;align-items:center;gap:12px;}
  .mark{width:38px;height:38px;flex:none;}
  .word{font-family:var(--font-sans);font-weight:700;font-size:27px;letter-spacing:-0.02em;color:var(--fg);line-height:1;}
  .lde{font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.14em;color:var(--accent-fg);border:1px solid var(--cinnabar-200);border-radius:var(--radius-sm);padding:2px 5px;margin-left:2px;text-transform:uppercase;align-self:center;}
  .panel{display:flex;align-items:center;gap:40px;flex-wrap:wrap;}
  .dark{background:var(--ink-950);border-radius:var(--radius-lg);padding:18px 22px;display:inline-flex;}
  .dark .word{color:var(--amate-50);}
</style></head>
<body>
  <div class="panel">
    <div class="lockup">
      <svg class="mark" viewBox="0 0 64 64" fill="none" style="color:var(--fg)">
        <g stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 23 V13 H23"/><path d="M41 13 H51 V23"/><path d="M51 41 V51 H41"/><path d="M23 51 H13 V41"/></g>
        <rect x="25.5" y="25.5" width="13" height="13" rx="3" fill="#CF4124"/>
      </svg>
      <span class="word">DOCYAN</span><span class="lde">LDE</span>
    </div>
    <div class="dark">
      <div class="lockup">
        <svg class="mark" viewBox="0 0 64 64" fill="none" style="color:var(--amate-50)">
          <g stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 23 V13 H23"/><path d="M41 13 H51 V23"/><path d="M51 41 V51 H41"/><path d="M23 51 H13 V41"/></g>
          <rect x="25.5" y="25.5" width="13" height="13" rx="3" fill="#D9633F"/>
        </svg>
        <span class="word">DOCYAN</span>
      </div>
    </div>
  </div>
  <p style="margin-top:18px;font-family:var(--font-sans);font-size:12.5px;color:var(--fg-muted);max-width:66ch;line-height:1.5">Corner-bracket frame = <em>the place where the document lives</em> (Yan = "lugar"), doubling as a QR-finder echo. The cinnabar square is the living document, bracketed. The same bracket motif recurs in the citation chip &amp; QR plate.</p>
</body></html>
