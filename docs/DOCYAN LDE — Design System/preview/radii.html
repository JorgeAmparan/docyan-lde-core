<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="md (8px) default control radius — shadcn-compatible" viewport="700x190" --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet"><link href="_card.css" rel="stylesheet">
<style>.b{display:flex;flex-direction:column;align-items:center;gap:8px;}.box{width:76px;height:54px;background:var(--cinnabar-50);border:1.5px solid var(--cinnabar-300);}.n{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-muted);}</style></head>
<body>
  <div class="eyebrow" style="margin-bottom:14px;">Corner radii</div>
  <div style="display:flex;gap:16px;align-items:flex-end;">
    <div class="b"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="n">xs · 3</span></div>
    <div class="b"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="n">sm · 5</span></div>
    <div class="b"><div class="box" style="border-radius:var(--radius-md)"></div><span class="n">md · 8</span></div>
    <div class="b"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="n">lg · 12</span></div>
    <div class="b"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="n">xl · 16</span></div>
    <div class="b"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="n">2xl · 22</span></div>
    <div class="b"><div class="box" style="border-radius:var(--radius-full)"></div><span class="n">full</span></div>
  </div>
  <p style="margin-top:16px;font-family:var(--font-sans);font-size:12.5px;color:var(--fg-muted)">md (8px) is the default control radius — shadcn-compatible. lg for cards, 2xl for the QR plate &amp; large sheets.</p>
</body></html>
