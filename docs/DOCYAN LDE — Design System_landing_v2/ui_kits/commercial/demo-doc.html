<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documento fuente · DOCYAN demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet">
<link href="../../colors_and_type.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--amate-100);font-family:var(--font-sans);color:var(--ink-900);-webkit-font-smoothing:antialiased;}
  .demo-ribbon{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;background:rgba(33,28,22,.94);color:var(--amate-50);padding:10px 18px;font-size:12.5px;backdrop-filter:blur(6px);}
  .demo-ribbon .dot{width:7px;height:7px;border-radius:50%;background:var(--cinnabar-400);}
  .demo-ribbon a{margin-left:auto;color:var(--amate-50);text-decoration:underline;font-weight:600;}
  .sheet{max-width:760px;margin:34px auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:54px 60px;}
  .doc-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-fg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .doc-eyebrow .pg{color:var(--fg-subtle);}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:12px 0 6px;}
  .doc-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-muted);border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:26px;}
  .doc-body{font-family:var(--font-serif);font-size:16px;line-height:1.72;color:var(--ink-800);}
  .doc-body h2{font-family:var(--font-sans);font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--ink-900);margin:28px 0 10px;}
  .doc-body p{margin:0 0 16px;}
  mark.span{background:var(--cinnabar-100);border-bottom:2px solid var(--cinnabar-500);color:var(--ink-900);padding:2px 3px;border-radius:2px;scroll-margin-top:120px;}
  .span-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-fg);background:var(--cinnabar-50);border:1px solid var(--cinnabar-100);border-radius:var(--radius-full);padding:3px 9px;vertical-align:middle;margin-left:8px;}
  .doc-foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle);display:flex;gap:8px;align-items:center;}
</style>
</head>
<body>
<div class="demo-ribbon"><span class="dot"></span>Documento demo de DOCYAN — contenido representativo para demostración.<a href="#" onclick="window.close();return false;">Cerrar</a></div>
<div class="sheet">
  <div class="doc-eyebrow"><span id="cite">Documento · §</span><span class="pg" id="pg">pág. —</span></div>
  <h1 id="title">Documento fuente</h1>
  <div class="doc-meta" id="meta">DOCYAN · CoDo demo</div>
  <div class="doc-body" id="body"></div>
  <div class="doc-foot"><span>Recuperado por DOCYAN con pedigree a span exacto · cadena SHA-256 verificable</span></div>
</div>
<script>
  const qs = new URLSearchParams(location.search);
  const title = qs.get("doc") || "Documento fuente";
  const cite = qs.get("cite") || "Documento · §";
  const page = qs.get("page") || "—";
  const span = qs.get("span") || "Fragmento citado del documento fuente.";
  const codo = qs.get("codo") || "CODO-DEMO";
  document.getElementById("title").textContent = title;
  document.getElementById("cite").textContent = cite;
  document.getElementById("pg").textContent = "pág. " + page;
  document.getElementById("meta").textContent = "DOCYAN · " + codo + " · documento vivo · revisión vigente";
  document.title = title + " · DOCYAN demo";

  const pre = [
    ["Propósito y alcance", "Este documento forma parte del acervo documental del CoDo y describe las condiciones de operación, los parámetros críticos y las precauciones aplicables. Su contenido es de cumplimiento obligatorio para el personal autorizado."],
    ["Condiciones previas", "Antes de cualquier intervención, verifica que las superficies de contacto estén limpias y libres de rebabas, y que el equipo se encuentre en estado seguro. Confirma la vigencia de los registros asociados."],
  ];
  const post = [
    ["Registro", "Tras completar el procedimiento, registra el valor y la fecha en la bitácora del equipo. La trazabilidad de cada acción queda encadenada criptográficamente en el FAT de DOCYAN."],
    ["Referencias", "Consulta los documentos relacionados del CoDo (manuales, MSDS, certificados de calibración) para el contexto completo. Cada cita en DOCYAN apunta al span exacto de su fuente."],
  ];
  const body = document.getElementById("body");
  function block(h, p){ const s=document.createElement("h2"); s.textContent=h; const t=document.createElement("p"); t.textContent=p; body.appendChild(s); body.appendChild(t); }
  pre.forEach(([h,p]) => block(h,p));
  // the cited section, with the highlighted span
  const sh = document.createElement("h2"); sh.textContent = cite.split("·").pop().trim() + " — sección citada"; body.appendChild(sh);
  const sp = document.createElement("p");
  sp.innerHTML = 'En las condiciones definidas para esta entidad operativa, aplica lo siguiente. <mark class="span" id="theSpan">' + span.replace(/</g,"&lt;") + '</mark><span class="span-tag">span citado por DOCYAN</span> Repite la verificación una segunda vez para asegurar el asentamiento y la consistencia del registro.';
  body.appendChild(sp);
  post.forEach(([h,p]) => block(h,p));

  window.addEventListener("load", () => {
    const m = document.getElementById("theSpan");
    if (m) { const y = m.getBoundingClientRect().top + window.scrollY - 130; window.scrollTo({ top: y, behavior: "instant" in document.documentElement.style ? "auto" : "auto" }); }
  });
</script>
</body>
</html>
