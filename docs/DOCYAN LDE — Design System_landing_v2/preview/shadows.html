<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet"><link href="_card.css" rel="stylesheet">
<style>body{background:var(--bg)}.b{display:flex;flex-direction:column;align-items:center;gap:10px;}.box{width:96px;height:60px;background:var(--surface);border-radius:var(--radius-lg);}.n{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-muted);}</style></head>
<body>
  <div class="eyebrow" style="margin-bottom:18px;">Elevation — warm, low, document-like (never bluish)</div>
  <div style="display:flex;gap:22px;align-items:flex-end;">
    <div class="b"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="n">xs</span></div>
    <div class="b"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="n">sm</span></div>
    <div class="b"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="n">md</span></div>
    <div class="b"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="n">lg</span></div>
    <div class="b"><div class="box" style="box-shadow:var(--shadow-cinnabar);background:var(--cinnabar-500)"></div><span class="n">cinnabar glow</span></div>
  </div>
  <p style="margin-top:20px;font-family:var(--font-sans);font-size:12.5px;color:var(--fg-muted)">Shadows tint with warm ink (33,28,22), not black/blue. The cinnabar glow is reserved for primary CTAs only.</p>
</body></html>
