<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet"><link href="_card.css" rel="stylesheet">
<style>
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-fg);background:var(--cinnabar-50);border:1px solid var(--cinnabar-100);padding:3px 7px;border-radius:var(--radius-sm);}
</style></head>
<body>
  <div class="eyebrow" style="margin-bottom:12px;">IBM Plex Mono · data, citations, technical labels</div>
  <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">
    <div><div class="mono" style="font-size:30px;font-weight:600;color:var(--fg)">0.92</div><div class="name">umbral de caché</div></div>
    <div><div class="mono" style="font-size:30px;font-weight:600;color:var(--fg)">P95 · 1.4s</div><div class="name">latencia</div></div>
    <div><div class="mono" style="font-size:30px;font-weight:500;color:var(--accent-fg)">§4.2.1</div><div class="name">span citado</div></div>
    <div style="display:flex;flex-direction:column;gap:8px;"><span class="tag">CODO-LAB-04</span><span class="tag">NOM-018-STPS</span></div>
  </div>
  <div style="margin-top:16px;" class="mono">0123456789 — tabular-nums · ISO 17025 · MSDS · §span</div>
</body></html>
