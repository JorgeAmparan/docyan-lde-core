<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet"><link href="_card.css" rel="stylesheet">
<style>.s{display:flex;flex-direction:column;align-items:center;gap:6px;}.bar{background:var(--cinnabar-200);height:28px;border-radius:2px;}.n{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-muted);}</style></head>
<body>
  <div class="eyebrow" style="margin-bottom:14px;">Spacing · 4px base</div>
  <div style="display:flex;gap:14px;align-items:flex-end;">
    <div class="s"><div class="bar" style="width:4px"></div><span class="n">1·4</span></div>
    <div class="s"><div class="bar" style="width:8px"></div><span class="n">2·8</span></div>
    <div class="s"><div class="bar" style="width:12px"></div><span class="n">3·12</span></div>
    <div class="s"><div class="bar" style="width:16px"></div><span class="n">4·16</span></div>
    <div class="s"><div class="bar" style="width:24px"></div><span class="n">6·24</span></div>
    <div class="s"><div class="bar" style="width:32px"></div><span class="n">8·32</span></div>
    <div class="s"><div class="bar" style="width:48px"></div><span class="n">12·48</span></div>
    <div class="s"><div class="bar" style="width:64px"></div><span class="n">16·64</span></div>
    <div class="s"><div class="bar" style="width:80px"></div><span class="n">20·80</span></div>
  </div>
  <p style="margin-top:16px;font-family:var(--font-sans);font-size:12.5px;color:var(--fg-muted)">Generous tap targets: minimum 44×44px on operator surfaces (gloves). Default control height 40px desktop, 48px touch.</p>
</body></html>
