<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../colors_and_type.css" rel="stylesheet"><link href="_card.css" rel="stylesheet">
<style>
  body{display:flex;gap:30px;align-items:flex-start;}
  /* Plate variant A — bracket-framed brand plate */
  .plate{background:#fff;border:1px solid var(--border);border-radius:var(--radius-2xl);padding:16px;box-shadow:var(--shadow-md);position:relative;width:152px;}
  .qrwrap{position:relative;padding:12px;}
  .qr{display:grid;width:108px;height:108px;margin:0 auto;}
  .qr i{background:var(--ink-900);}
  /* cinnabar corner brackets around the code (span motif) */
  .qrwrap::before,.qrwrap::after,.cbr1,.cbr2{content:"";position:absolute;width:16px;height:16px;border:2.5px solid var(--cinnabar-500);}
  .qrwrap::before{top:2px;left:2px;border-right:none;border-bottom:none;border-radius:4px 0 0 0;}
  .qrwrap::after{top:2px;right:2px;border-left:none;border-bottom:none;border-radius:0 4px 0 0;}
  .cbr1{bottom:2px;left:2px;border-right:none;border-top:none;border-radius:0 0 0 4px;}
  .cbr2{bottom:2px;right:2px;border-left:none;border-top:none;border-radius:0 0 4px 0;}
  .plate-foot{display:flex;align-items:center;gap:7px;margin-top:10px;justify-content:center;}
  .pw{font-family:var(--font-sans);font-weight:700;font-size:14px;letter-spacing:-.01em;color:var(--fg);}
  .pmark{width:15px;height:15px;}
  .codo{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;color:var(--fg-muted);text-align:center;margin-top:3px;}
  /* Variant B — industrial asset tag */
  .tag{background:var(--ink-900);border-radius:var(--radius-lg);padding:14px;width:150px;color:var(--amate-50);box-shadow:var(--shadow-md);}
  .tagtop{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .tagtop .pw{color:var(--amate-50);font-size:12px;}
  .tag .qrcard{background:#fff;border-radius:var(--radius-sm);padding:9px;}
  .tag .codo{color:var(--amate-300);text-align:left;margin-top:9px;}
  .cap{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.1em;margin-top:10px;text-align:center;}
</style></head>
<body>
  <div>
    <div class="plate">
      <div class="qrwrap"><span class="cbr1"></span><span class="cbr2"></span>
        <div class="qr" id="qrA"></div>
      </div>
      <div class="plate-foot">
        <svg class="pmark" viewBox="0 0 64 64" fill="none" style="color:var(--fg)"><g stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 23 V13 H23"/><path d="M41 13 H51 V23"/><path d="M51 41 V51 H41"/><path d="M23 51 H13 V41"/></g><rect x="25" y="25" width="14" height="14" rx="3" fill="#CF4124"/></svg>
        <span class="pw">DOCYAN</span>
      </div>
      <div class="codo">CODO-LAB-04 · CENTRÍFUGA HETTICH</div>
    </div>
    <div class="cap">A · plate / bracket-frame</div>
  </div>
  <div>
    <div class="tag">
      <div class="tagtop">
        <svg class="pmark" viewBox="0 0 64 64" fill="none" style="color:var(--amate-50)"><g stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 23 V13 H23"/><path d="M41 13 H51 V23"/><path d="M51 41 V51 H41"/><path d="M23 51 H13 V41"/></g><rect x="25" y="25" width="14" height="14" rx="3" fill="#D9633F"/></svg>
        <span class="pw">DOCYAN</span>
      </div>
      <div class="qrcard"><div class="qr" id="qrB" style="width:124px;height:124px;"></div></div>
      <div class="codo">ESCANEA · CONSULTA<br>CODO-LAB-04</div>
    </div>
    <div class="cap">B · equipment asset-tag</div>
  </div>
<script>
  function buildQR(el,n){
    el.style.gridTemplateColumns="repeat("+n+",1fr)";
    // deterministic pseudo-random pattern
    let s=7;const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
    const finder=(r,c)=>(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);
    const inFinder=(r,c,br,bc)=>{const lr=r-br,lc=c-bc;if(lr<0||lc<0||lr>6||lc>6)return null;
      if(lr===0||lr===6||lc===0||lc===6)return true;if(lr>=2&&lr<=4&&lc>=2&&lc<=4)return true;return false;};
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){
      const i=document.createElement('i');let on=false;
      if(finder(r,c)){const a=inFinder(r,c,0,0),b=inFinder(r,c,0,n-7),d=inFinder(r,c,n-7,0);on=a||b||d;}
      else on=rnd()>0.5;
      if(!on)i.style.background='transparent';el.appendChild(i);
    }
  }
  buildQR(document.getElementById('qrA'),21);
  buildQR(document.getElementById('qrB'),23);
</script>
</body></html>
